<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BeyondMoment Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05070f; --bg-soft: #0d1230; --card: #11163a; --border: rgba(160,176,235,0.18);
    --text: #eef1fb; --text-dim: #a9b2d6; --accent: #ffd9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background:
      radial-gradient(120% 90% at 50% 8%, #1a2350 0%, #0d1230 38%, #05070f 78%);
    background-attachment: fixed;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 40px;
    letter-spacing: -0.01em; margin-bottom: 6px;
  }
  h1 .accent-word { color: var(--accent); font-style: italic; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; margin-bottom: 20px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input, textarea, select {
    width: 100%; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); padding: 12px 14px; font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  button {
    background: linear-gradient(135deg, #ffe3b4, #ffc98a); color: #1a1206; border: none;
    border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
  button.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: 13px; }
  .counter { font-size: 12px; color: var(--text-dim); text-align: right; margin-top: 4px; }
  .counter.over { color: #ff9a8f; }
  .status { font-size: 13px; color: var(--text-dim); margin-top: 10px; min-height: 18px; }
  .status.error { color: #ff9a8f; }
  .status.success { color: #a4e6a0; }
  .moment { border-top: 1px solid var(--border); padding: 12px 0; }
  .moment:first-child { border-top: none; padding-top: 0; }
  .moment-text { font-size: 15px; margin-bottom: 4px; white-space: pre-wrap; }
  .moment-meta { font-size: 12px; color: var(--text-dim); }
  .moment-meta a { color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 14px; }
  a { color: var(--accent); }

  #moments-section {
    background:
      linear-gradient(180deg, #0a1030 0%, #141a3d 44%, #3a2a4e 74%, #52394a 100%);
    border-color: rgba(180, 196, 255, 0.16);
  }
  #moments-section > strong {
    font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 500;
    letter-spacing: 0.01em; color: #f4f6ff;
  }
  .constellation-wrap { position: relative; margin: 4px -6px 0; overflow: hidden; border-radius: 12px; }
  .constellation-wrap svg { display: block; width: 100%; height: auto; }
  .ambient-star { animation: ambient-twinkle 4s ease-in-out infinite; }
  @keyframes ambient-twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.75; } }
  .star-node { cursor: pointer; transform-origin: center; transform-box: fill-box; transition: transform 0.2s ease; }
  .star-node:hover { transform: scale(1.18); }
  .star-halo { animation: star-twinkle 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes star-twinkle { 0%, 100% { opacity: 0.22; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.15); } }
  .constellation-path { filter: url(#line-glow); }
  .star-label-id { font: 10px "Consolas", monospace; }
  .star-label-date { font: 9px "Consolas", monospace; fill: #aab2d8; }
  .star-label-text { font: 13px "Cormorant Garamond", serif; fill: #f4f6ff; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  .modal-card {
    background: linear-gradient(160deg, #1a2350 0%, #141a3d 55%, #2a2044 100%);
    border: 1px solid rgba(180, 196, 255, 0.2); border-radius: 16px;
    padding: 24px; max-width: 420px; width: 100%;
    box-shadow: 0 30px 70px rgba(0,0,0,0.45);
  }
  .modal-card .moment-text {
    font-family: "Cormorant Garamond", serif; font-size: 20px; line-height: 1.6;
    margin-bottom: 14px; white-space: pre-wrap; color: #f8f9ff;
  }
  .modal-close { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 999px; padding: 8px 18px; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Beyond<span class="accent-word">Moment</span> Chain</h1>
  <p class="sub">순간을 이더리움 블록체인에 영구히 기록합니다 (Sepolia 테스트넷 프로토타입)</p>

  <section id="auth-section" class="card">
    <div id="auth-form">
      <label for="username">아이디</label>
      <input id="username" placeholder="영문/숫자 3~24자" maxlength="24" />
      <label for="password">비밀번호</label>
      <input id="password" type="password" placeholder="6자 이상" />
      <button id="auth-submit" style="width:100%; margin-top:16px;">로그인</button>
      <div style="text-align:center; margin-top:12px; font-size:13px; color:var(--text-dim);">
        계정이 없나요? <button class="link" id="mode-toggle">회원가입</button>
      </div>
      <div id="auth-status" class="status error"></div>
    </div>
    <div id="account-row" class="row" style="display:none;">
      <span id="account-label"></span>
      <button class="ghost" id="logout-btn">로그아웃</button>
    </div>
  </section>

  <section id="record-section" class="card" style="display:none;">
    <textarea id="moment-text" maxlength="1000" placeholder="지금 이 순간을 글로 남겨보세요..."></textarea>
    <div class="counter" id="char-counter">0 / 500</div>
    <label for="parent-select">어디에 이어질까요?</label>
    <select id="parent-select">
      <option value="">🌱 새로운 이야기로 시작</option>
    </select>
    <button id="record-btn" disabled style="width:100%; margin-top:10px;">순간 기록하기</button>
    <div id="record-status" class="status"></div>
  </section>

  <section id="moments-section" class="card" style="display:none;">
    <div class="row" style="margin-bottom:12px;">
      <strong>내 순간들</strong>
      <button class="ghost" id="refresh-btn">새로고침</button>
    </div>
    <div id="moments-list" class="empty">불러오는 중...</div>
    <div class="moment-meta" style="margin-top:14px;">
      <a id="contract-link" href="#" target="_blank" rel="noopener">전체 기록을 블록체인에서 직접 확인하기 →</a>
    </div>
  </section>
</main>

<div id="star-modal-backdrop" class="modal-backdrop" style="display:none;">
  <div class="modal-card">
    <div id="star-modal-date" class="moment-meta" style="margin-bottom:8px;"></div>
    <div id="star-modal-text" class="moment-text"></div>
    <div id="star-modal-link" class="moment-meta"></div>
    <button class="modal-close" id="star-modal-close">닫기</button>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { ethers } from 'https://esm.sh/ethers@6.13.4';

const cfg = window.BEYOND_MOMENTS_CONFIG;
const MAX_LEN = 500;
const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
const readProvider = new ethers.JsonRpcProvider(cfg.rpcUrl);
let abi = null;
let readContract = null;
let session = null;
let mode = 'signin';

const authForm = document.getElementById('auth-form');
const accountRow = document.getElementById('account-row');
const accountLabel = document.getElementById('account-label');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const authSubmit = document.getElementById('auth-submit');
const modeToggle = document.getElementById('mode-toggle');
const authStatus = document.getElementById('auth-status');
const logoutBtn = document.getElementById('logout-btn');
const recordSection = document.getElementById('record-section');
const momentsSection = document.getElementById('moments-section');
const momentText = document.getElementById('moment-text');
const parentSelect = document.getElementById('parent-select');
const charCounter = document.getElementById('char-counter');
const recordBtn = document.getElementById('record-btn');
const recordStatus = document.getElementById('record-status');
const momentsList = document.getElementById('moments-list');
const refreshBtn = document.getElementById('refresh-btn');

abi = await fetch('abi.json').then((r) => r.json());
readContract = new ethers.Contract(cfg.contractAddress, abi, readProvider);
document.getElementById('contract-link').href = `${cfg.blockExplorerUrl}/address/${cfg.contractAddress}`;

function usernameEmail(name) {
  return `${name.trim().toLowerCase()}@users.beyondmoment.com`;
}

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function updateCounter() {
  const len = new TextEncoder().encode(momentText.value).length;
  charCounter.textContent = `${len} / ${MAX_LEN}`;
  charCounter.classList.toggle('over', len > MAX_LEN);
  recordBtn.disabled = len === 0 || len > MAX_LEN;
}
momentText.addEventListener('input', updateCounter);

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

const STAR_COLORS = ['#ffe3b4', '#8fd6e8', '#f2a7c3', '#c7f2a7', '#c7b4ff'];
let currentMoments = [];

// Moments form a forest (each has an optional parentId). Lay them out top to
// bottom in recording order; a moment continues its parent's lane if it's the
// parent's first child seen so far, otherwise it branches into a fresh lane
// -- so a moment with multiple children visibly forks the constellation.
function layoutMoments(moments) {
  const laneOfId = new Map();
  const childCountSeen = new Map();
  let nextLane = 0;

  const items = moments.map((m, i) => {
    const parentKey = String(m.parentId);
    const parentInSet = laneOfId.has(parentKey);
    let lane;
    if (!parentInSet) {
      lane = nextLane++;
    } else {
      const seen = childCountSeen.get(parentKey) || 0;
      childCountSeen.set(parentKey, seen + 1);
      lane = seen === 0 ? laneOfId.get(parentKey) : nextLane++;
    }
    laneOfId.set(String(m.id), lane);
    return { m, lane, parentKey, parentInSet, index: i };
  });

  return { items, laneCount: nextLane };
}

// A small deterministic PRNG so the ambient starfield doesn't jump around
// on every reload/refresh -- seeded by moment count so it still varies
// as the constellation grows.
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function next() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function buildAmbientStars(width, height, count) {
  const rand = seededRandom(width * 7 + height * 13 + count * 101 + 1);
  let svg = '';
  for (let i = 0; i < count; i++) {
    const cx = (rand() * width).toFixed(1);
    const cy = (rand() * height).toFixed(1);
    const r = (0.4 + rand() * 1.1).toFixed(2);
    const delay = (rand() * 4).toFixed(2);
    const dur = (3 + rand() * 3).toFixed(2);
    svg += `<circle class="ambient-star" cx="${cx}" cy="${cy}" r="${r}" fill="#fff" style="animation-delay:${delay}s; animation-duration:${dur}s;" />`;
  }
  return svg;
}

function buildConstellationSvg(moments) {
  const { items, laneCount } = layoutMoments(moments);
  const compact = laneCount > 1;
  const spacing = 110;
  const topPad = 34;
  const bottomPad = 34;
  const laneWidth = 60;
  const leftPad = 40;
  const width = compact ? leftPad * 2 + laneCount * laneWidth : 340;
  const height = topPad + bottomPad + spacing * Math.max(items.length - 1, 0);

  const posOf = new Map();
  items.forEach((item) => {
    const x = compact ? leftPad + item.lane * laneWidth : 150 + Math.sin(item.index * 0.9) * 26;
    const y = topPad + item.index * spacing;
    posOf.set(String(item.m.id), { x, y });
  });

  const linksSvg = items
    .filter((item) => item.parentInSet)
    .map((item) => {
      const child = posOf.get(String(item.m.id));
      const parent = posOf.get(item.parentKey);
      const midY = (parent.y + child.y) / 2;
      return `<path class="constellation-path" d="M ${parent.x} ${parent.y} C ${parent.x} ${midY}, ${child.x} ${midY}, ${child.x} ${child.y}" fill="none" stroke="rgba(226,214,255,.5)" stroke-width="1" stroke-dasharray="4 6" />`;
    })
    .join('');

  const starsSvg = items
    .map((item, i) => {
      const m = item.m;
      const p = posOf.get(String(m.id));
      const color = STAR_COLORS[i % STAR_COLORS.length];
      const delay = (i * 0.35).toFixed(2);
      if (compact) {
        return `
          <g class="star-node" data-id="${m.id}">
            <circle class="star-halo" cx="${p.x}" cy="${p.y}" r="12" fill="${color}" opacity="0.3" filter="url(#star-glow)" style="animation-delay:${delay}s;" />
            <circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" />
            <text class="star-label-id" x="${p.x}" y="${p.y + 22}" fill="${color}" text-anchor="middle">#${m.id}</text>
          </g>
        `;
      }
      const date = new Date(Number(m.timestamp) * 1000);
      const dateStr = date.toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' });
      const labelX = p.x + 22;
      const preview = m.text.length > 20 ? m.text.slice(0, 20) + '…' : m.text;
      return `
        <g class="star-node" data-id="${m.id}">
          <circle class="star-halo" cx="${p.x}" cy="${p.y}" r="13" fill="${color}" opacity="0.3" filter="url(#star-glow)" style="animation-delay:${delay}s;" />
          <circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" />
          <text class="star-label-id" x="${labelX}" y="${p.y - 14}" fill="${color}">#${m.id}</text>
          <text class="star-label-date" x="${labelX}" y="${p.y - 2}">${dateStr}</text>
          <text class="star-label-text" x="${labelX}" y="${p.y + 14}">${escapeHtml(preview)}</text>
        </g>
      `;
    })
    .join('');

  const ambientSvg = buildAmbientStars(width, height, Math.min(60, Math.max(24, items.length * 6)));

  return `
    <svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="line-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="0.6" />
        </filter>
        <filter id="star-glow" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="3.2" />
        </filter>
      </defs>
      ${ambientSvg}
      ${linksSvg}
      ${starsSvg}
    </svg>
  `;
}

function openStarModal(id) {
  const m = currentMoments.find((x) => String(x.id) === String(id));
  if (!m) return;
  const date = new Date(Number(m.timestamp) * 1000).toLocaleString('ko-KR');
  document.getElementById('star-modal-date').textContent = `#${m.id} · ${date}`;
  document.getElementById('star-modal-text').textContent = m.text;
  const linkEl = document.getElementById('star-modal-link');
  linkEl.textContent = '트랜잭션 조회 중...';
  document.getElementById('star-modal-backdrop').style.display = 'flex';

  readContract
    .queryFilter(readContract.filters.MomentRecorded(m.id), cfg.deployBlock)
    .then((events) => {
      if (events[0]) {
        linkEl.innerHTML = `<a href="${cfg.blockExplorerUrl}/tx/${events[0].transactionHash}" target="_blank" rel="noopener">Etherscan에서 확인 →</a>`;
      } else {
        linkEl.textContent = '';
      }
    })
    .catch(() => {
      linkEl.textContent = '';
    });
}

document.getElementById('star-modal-close').addEventListener('click', () => {
  document.getElementById('star-modal-backdrop').style.display = 'none';
});
document.getElementById('star-modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'star-modal-backdrop') e.currentTarget.style.display = 'none';
});

function renderSignedIn() {
  const username = session.user.user_metadata?.username ?? session.user.email;
  authForm.style.display = 'none';
  accountRow.style.display = 'flex';
  accountLabel.textContent = username;
  recordSection.style.display = 'block';
  momentsSection.style.display = 'block';
  loadMoments();
}

function renderSignedOut() {
  authForm.style.display = 'block';
  accountRow.style.display = 'none';
  recordSection.style.display = 'none';
  momentsSection.style.display = 'none';
}

modeToggle.addEventListener('click', () => {
  mode = mode === 'signin' ? 'signup' : 'signin';
  authSubmit.textContent = mode === 'signin' ? '로그인' : '회원가입';
  modeToggle.textContent = mode === 'signin' ? '회원가입' : '로그인';
  authStatus.textContent = '';
});

authSubmit.addEventListener('click', async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  if (!/^[a-zA-Z0-9._-]{3,24}$/.test(username)) {
    setStatus(authStatus, '아이디는 3~24자의 영문, 숫자, ., -, _ 만 사용할 수 있어요.', 'error');
    return;
  }
  if (password.length < 6) {
    setStatus(authStatus, '비밀번호는 6자 이상이어야 해요.', 'error');
    return;
  }
  authSubmit.disabled = true;
  setStatus(authStatus, '처리 중...', '');
  try {
    const email = usernameEmail(username);
    const { data, error } =
      mode === 'signin'
        ? await supabase.auth.signInWithPassword({ email, password })
        : await supabase.auth.signUp({ email, password, options: { data: { username: username.toLowerCase() } } });
    if (error) throw error;
    session = data.session;
    setStatus(authStatus, '', '');
    renderSignedIn();
  } catch (err) {
    setStatus(authStatus, err.message || String(err), 'error');
  } finally {
    authSubmit.disabled = false;
  }
});

logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  session = null;
  renderSignedOut();
});

recordBtn.addEventListener('click', async () => {
  const text = momentText.value.trim();
  if (!text || !session) return;
  recordBtn.disabled = true;
  setStatus(recordStatus, '기록 요청 중... (몇 초 정도 걸릴 수 있어요)', '');
  try {
    const parentId = parentSelect.value || undefined;
    const res = await fetch(cfg.edgeFunctionUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ text, parentId }),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '기록에 실패했어요.');
    recordStatus.className = 'status success';
    recordStatus.innerHTML =
      '순간이 영구히 기록되었습니다. ' +
      `<a href="${cfg.blockExplorerUrl}/tx/${result.txHash}" target="_blank" rel="noopener">Etherscan에서 확인</a>`;
    momentText.value = '';
    parentSelect.value = '';
    updateCounter();
    loadMoments();
  } catch (err) {
    setStatus(recordStatus, '실패: ' + (err.message || err), 'error');
  } finally {
    recordBtn.disabled = false;
    updateCounter();
  }
});

function populateParentSelect(moments) {
  const options = ['<option value="">🌱 새로운 이야기로 시작</option>'];
  moments
    .slice()
    .reverse()
    .forEach((m) => {
      const date = new Date(Number(m.timestamp) * 1000).toLocaleDateString('ko-KR');
      const preview = m.text.length > 18 ? m.text.slice(0, 18) + '…' : m.text;
      options.push(`<option value="${m.id}">#${m.id} · ${date} · ${escapeHtml(preview)}</option>`);
    });
  parentSelect.innerHTML = options.join('');
}

async function loadMoments() {
  if (!session) return;
  const username = (session.user.user_metadata?.username ?? '').toLowerCase();
  momentsList.textContent = '불러오는 중...';
  momentsList.className = 'empty';
  try {
    const ids = await readContract.getMomentIdsByUserId(username);
    if (ids.length === 0) {
      momentsList.textContent = '아직 기록된 순간이 없어요.';
      currentMoments = [];
      populateParentSelect([]);
      return;
    }
    const moments = await Promise.all(
      ids.map((id) =>
        readContract
          .getMoment(id)
          .then(([author, userId, timestamp, text, parentId]) => ({ id, author, userId, timestamp, text, parentId }))
      )
    );
    currentMoments = moments;
    momentsList.className = 'constellation-wrap';
    momentsList.innerHTML = buildConstellationSvg(moments);
    populateParentSelect(moments);
  } catch (err) {
    momentsList.textContent = '불러오지 못했습니다: ' + (err.message || err);
  }
}

refreshBtn.addEventListener('click', loadMoments);
momentsList.addEventListener('click', (e) => {
  const node = e.target.closest('.star-node');
  if (node) openStarModal(node.dataset.id);
});

const { data: existing } = await supabase.auth.getSession();
if (existing.session) {
  session = existing.session;
  renderSignedIn();
} else {
  renderSignedOut();
}
updateCounter();
</script>
</body>
</html>
